<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM/NS INDIA Pune - Line Observation (5S / UC / UA)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--red:#E31837;--red-h:#C1121F;--s50:#F8FAFC;--s100:#F1F5F9;--s200:#E2E8F0;--s600:#475569;--s800:#1E293B;--green:#10B981;--amber:#F59E0B;--rl:16px;--rm:10px;--sh:0 4px 6px -1px rgba(0,0,0,.05);--shl:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04)}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0;padding:0}
body{background:linear-gradient(135deg,#0F172A,#1E293B);color:var(--s800);min-height:100vh;padding:clamp(10px,3vw,30px);display:flex;justify-content:center;align-items:flex-start}
.main-wrapper{width:100%;max-width:1250px;background:rgba(255,255,255,.96);border-radius:var(--rl);box-shadow:var(--shl);overflow:hidden;animation:fadeIn .4s ease-out}
.app-header{background:linear-gradient(135deg,#1E293B,#0F172A);padding:clamp(16px,4vw,28px);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;border-bottom:4px solid var(--red)}
.header-brand h1{font-size:clamp(20px,4vw,28px);font-weight:800;background:linear-gradient(90deg,#fff,#CBD5E1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-brand p{color:#94A3B8;font-size:clamp(12px,2vw,14px);margin-top:4px}
.logo-badge{background:#fff;padding:8px 14px;border-radius:12px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo-badge img{height:54px;width:auto;display:block}
.footer-left{display:flex;flex-direction:column;gap:4px}
.save-status{font-size:12px;color:var(--s600);font-weight:600}
.save-status.err{color:#E31837}
@media(max-width:600px){.logo-badge img{height:42px}}
.audit-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:clamp(16px,3vw,24px);background:var(--s50);border-bottom:1px solid var(--s200)}
.input-field{display:flex;flex-direction:column;gap:6px}
.input-field label{font-size:11px;font-weight:700;color:var(--s600);text-transform:uppercase;letter-spacing:.5px}
.input-field input,.input-field select{padding:12px 14px;border:1px solid var(--s200);border-radius:var(--rm);font-size:14px;background:#fff;color:var(--s800);box-shadow:var(--sh)}
.input-field input:focus,.input-field select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,24,55,.15)}
.score-summary-bar{padding:16px clamp(16px,3vw,24px);background:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--s200)}
.score-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score-info-title{font-size:15px;font-weight:700}
.meter-container{width:200px;height:10px;background:var(--s100);border-radius:20px;overflow:hidden;border:1px solid var(--s200)}
.meter-fill{height:100%;width:0;background:var(--red);transition:width .4s,background-color .4s}
.score-pill{font-size:20px;font-weight:900;color:#fff;background:var(--red);padding:6px 18px;border-radius:30px;box-shadow:var(--sh);transition:background-color .3s}
.score-count{font-size:12px;color:var(--s600);font-weight:600}
.audit-body{padding:clamp(16px,3vw,24px)}
.category-section{margin-bottom:28px;background:#fff;border:1px solid var(--s200);border-radius:var(--rm);overflow:hidden;box-shadow:var(--sh)}
.category-title{background:var(--s800);color:#fff;padding:12px 20px;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.category-title::before{content:'';width:8px;height:8px;background:var(--red);border-radius:50%}
.category-title.common{background:var(--red)}
.category-title.common::before{background:#fff}
.item-card{display:grid;grid-template-columns:45px 1.2fr 1.8fr 1.2fr 2fr 150px;align-items:start;gap:14px;padding:16px 20px;border-bottom:1px solid var(--s100)}
.item-card:last-child{border-bottom:none}
.item-card:hover{background:#FAF5F5}
.item-index{font-weight:800;color:var(--red);font-size:13px;background:var(--s100);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:4px}
.item-name{font-weight:700;font-size:14px;margin-top:6px}
.item-desc{font-size:13px;color:var(--s600);line-height:1.4;margin-top:6px}
.remark-field{margin-top:4px}
.remark-field input{width:100%;padding:8px 10px;font-size:12px;border:1px solid var(--s200);border-radius:6px;background:#fff;color:var(--s800)}
.photo-field{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.photo-field>label{font-size:10px;font-weight:800;color:var(--s600);text-transform:uppercase}
.photo-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-select-photo{background:var(--s800);color:#fff;padding:6px 12px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer}
.btn-upload-confirm{background:var(--s600);color:#fff;border:none;padding:6px 12px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer}
.btn-upload-confirm.uploaded{background:var(--green)}
.preview-container{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.preview-thumb{position:relative;width:50px;height:50px;border-radius:6px;overflow:hidden;border:1px solid var(--s200)}
.preview-thumb img{width:100%;height:100%;object-fit:cover}
.preview-thumb .remove-btn{position:absolute;top:2px;right:2px;background:rgba(227,24,55,.85);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;cursor:pointer}
.btn-toggle{width:100%;padding:10px 12px;border-radius:30px;border:2px solid var(--s200);background:#fff;color:var(--s600);font-weight:800;font-size:11px;cursor:pointer;transition:all .25s;box-shadow:var(--sh);margin-top:4px}
.btn-toggle.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.35)}
.status-group{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.btn-status{width:100%;padding:10px 12px;border-radius:30px;border:2px solid var(--red);background:var(--red);color:#fff;font-weight:800;font-size:11px;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.btn-status.sel{background:var(--green);border-color:var(--green);box-shadow:0 4px 12px rgba(16,185,129,.35)}
.dock-footer{padding:20px clamp(16px,3vw,24px);background:var(--s50);border-top:1px solid var(--s200);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.status-text{font-size:13px;font-weight:600;color:var(--s600)}
.btn-submit{background:linear-gradient(135deg,var(--red),var(--red-h));color:#fff;border:none;padding:14px 36px;font-size:15px;font-weight:800;border-radius:var(--rm);cursor:pointer;text-transform:uppercase;box-shadow:0 4px 14px rgba(227,24,55,.35);width:100%;max-width:280px}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:960px){.item-card{grid-template-columns:36px 1fr;gap:10px;padding:16px}.item-desc,.remark-field,.photo-field,.status-group{grid-column:1/-1}.status-group{flex-direction:row}.btn-status{flex:1}}
@media(max-width:600px){.dock-footer{flex-direction:column;text-align:center}.btn-submit{max-width:100%}.meter-container{width:100%}.score-summary-bar{flex-direction:column;align-items:stretch}.score-pill{text-align:center}}

.audit-meta-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.input-field input[readonly]{background:var(--s100);font-weight:700}
.input-field textarea{padding:12px 14px;border:1px solid var(--s200);border-radius:var(--rm);font-size:14px;resize:vertical;box-shadow:var(--sh)}
.input-field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,24,55,.15)}
.obs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:16px 20px}
.obs-grid .full{grid-column:1/-1}
.category-title{justify-content:flex-start}.rm-obs{margin-left:auto;background:transparent;border:1px solid #fff;color:#fff;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer}
.preview-thumb{width:64px;height:64px}
.srow{display:flex;gap:8px}.st-btn{flex:1;padding:11px;border-radius:30px;border:2px solid var(--s200);background:#fff;color:var(--s600);font-weight:800;font-size:12px;cursor:pointer}
.st-btn.sel.open{background:var(--red);border-color:var(--red);color:#fff}.st-btn.sel.close{background:var(--green);border-color:var(--green);color:#fff}
.btn-add{width:100%;padding:14px;border:2px dashed var(--red);background:#fff;color:var(--red);font-weight:800;font-size:14px;border-radius:var(--rm);cursor:pointer}.btn-add:disabled{opacity:.5}
.btn-dl{background:#fff;border:2px solid var(--s800);color:var(--s800);padding:12px 18px;font-weight:800;font-size:13px;border-radius:var(--rm);cursor:pointer}
.foot-btns{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:600px){.foot-btns{flex-direction:column;width:100%}.btn-dl{width:100%}}

body{background:linear-gradient(-45deg,#0F172A,#1E293B,#3b0a14,#0F172A);background-size:400% 400%;animation:bgmove 18s ease infinite}
@keyframes bgmove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.bg-anim{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-anim span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(227,24,55,.35),transparent 70%);animation:float 14s ease-in-out infinite}
.bg-anim span:nth-child(1){width:380px;height:380px;left:-90px;top:8%}.bg-anim span:nth-child(2){width:300px;height:300px;right:-60px;top:45%;animation-delay:-5s}.bg-anim span:nth-child(3){width:240px;height:240px;left:40%;bottom:-80px;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}}
.main-wrapper{position:relative;z-index:1;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(6px)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.app-header{position:relative;overflow:hidden}
.app-header::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:shine 3s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.logo-badge{animation:pop .8s .2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
.header-brand h1{animation:rise .7s .1s both}.header-brand p{animation:rise .7s .25s both}
.audit-meta-grid .input-field{animation:rise .6s both}.audit-meta-grid .input-field:nth-child(2){animation-delay:.1s}.audit-meta-grid .input-field:nth-child(3){animation-delay:.2s}
.category-section{transition:transform .25s,box-shadow .25s,border-color .25s}
.category-section:hover{transform:translateY(-3px);box-shadow:0 14px 28px -8px rgba(227,24,55,.25);border-color:#f3b4be}
.category-section.new{animation:slidein .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(-30px) scale(.97)}to{opacity:1;transform:none}}
.category-title{background:linear-gradient(90deg,#1E293B,#334155)}.category-title::before{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,24,55,.7)}100%{box-shadow:0 0 0 9px rgba(227,24,55,0)}}
.input-field input,.input-field select,.input-field textarea{transition:border-color .2s,box-shadow .2s,transform .2s}
.input-field input:focus,.input-field select:focus,.input-field textarea:focus{transform:translateY(-1px)}
.btn-select-photo,.btn-add,.btn-submit,.rm-obs{transition:transform .2s,box-shadow .2s,background .2s}
.btn-select-photo:hover,.btn-add:hover:not(:disabled),.btn-submit:hover:not(:disabled){transform:translateY(-2px)}.btn-add:hover:not(:disabled){background:var(--red);color:#fff}
.btn-submit{position:relative;overflow:hidden;animation:glow 2.4s infinite}.btn-submit::before{content:'';position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 2.8s infinite}
@keyframes sweep{to{left:130%}}@keyframes glow{0%,100%{box-shadow:0 4px 14px rgba(227,24,55,.35)}50%{box-shadow:0 4px 26px rgba(227,24,55,.65)}}
.preview-thumb{animation:pop .4s both}
.score-pill{display:inline-block;animation:pop .5s both}
#okOv{position:fixed;inset:0;background:rgba(15,23,42,.8);display:none;align-items:center;justify-content:center;z-index:120;padding:20px;backdrop-filter:blur(4px)}
#okOv.show{display:flex}.ok-card{background:#fff;border-radius:20px;padding:34px 26px;max-width:380px;text-align:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.ok-card svg{width:90px;height:90px}.ok-card circle{fill:none;stroke:#10B981;stroke-width:5;stroke-dasharray:166;stroke-dashoffset:166;animation:draw .7s forwards}
.ok-card path{fill:none;stroke:#10B981;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .6s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.ok-card h2{margin:12px 0 6px;color:#1E293B}.ok-card p{color:#475569;font-size:14px;line-height:1.5;margin-bottom:18px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:130;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<section class="audit-meta-grid">
<div class="input-field"><label for="observerName">Observer Name *</label><input type="text" id="observerName" maxlength="100" value="Mr. Dattu Labade" readonly required></div>
<div class="input-field"><label for="sapId">Observer SAP ID *</label><input type="text" id="sapId" maxlength="30" value="20036751" readonly required></div>
<div class="input-field"><label for="lineSelect">Line *</label><select id="lineSelect" required><option value="">— Select line —</option><option value="CGL 1">CGL 1</option><option value="CGL 2">CGL 2</option></select></div>
<div class="input-field"><label for="obsDate">Observation Date *</label><input type="date" id="obsDate"></div>
<div class="input-field"><label for="assignAll">Compliance Person / Assign To *</label><select id="assignAll"></select></div>
</section>
<section class="score-summary-bar"><span class="score-info-title">Observations recorded</span><div class="score-pill" id="cnt">1</div></section>
<main class="audit-body"><div id="obsList"></div><button type="button" class="btn-add" id="addBtn" onclick="addObs()"></button></main>
<footer class="dock-footer"><div class="footer-left"><div class="status-text" id="statusMessage">● Ready</div><div class="save-status" id="saveStatus">💾 Autosave on</div></div>
<div class="foot-btns"><button class="btn-dl" type="button" onclick="downloadExcel()">Download Excel Preview</button><button class="btn-submit" id="submitBtn" onclick="submitForm()">Submit &amp; Email</button></div></footer>
</div>
<div id="camModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;">
<video id="camVideo" autoplay playsinline muted style="max-width:100%;max-height:70vh;border-radius:10px;"></video><div id="camInfo" style="color:#fff;font-size:13px;font-weight:600;"></div>
<div style="display:flex;gap:10px;"><button class="btn-submit" style="max-width:170px;" onclick="snap()">📸 Capture</button><button class="btn-upload-confirm" style="padding:12px 24px;font-size:13px;" onclick="closeCam()">Done</button></div></div>
<div id="okOv"><div class="ok-card"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="25"/><path d="M14 27l8 8 16-17"/></svg><h2>Submitted!</h2><p id="okMsg"></p><button class="btn-submit" style="max-width:100%" onclick="document.getElementById('okOv').classList.remove('show')">New Observation</button></div></div>
<script>
/* ===== CONFIGURE THESE 3 LINES ===== */
const FLOW_URL='https://default37cd273a1cec4aaea29741480ea54f.8d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/644fc7bbd86e47059bd035e9a8b2b3e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Eo29WGRp_ywyvm_b_yr2puGPMTxOhfYa2KGAwwnmfDs';        // HTTP POST URL of flow 1
const RESPONSE_URL='PASTE_PUBLIC_URL_OF_response.html';         // where you host response.html (https://...)
const REVIEWER_EMAIL='PASTE_REVIEWER_EMAIL@amns.in';            // optional reviewer/central compliance email, configured by admin
/* ==================================== */
const mkToken=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'');
const MAX_OBS=15, MAX_PH=5;
const ASSIGNEES=['anil.shirke@amns.in','Narendra.chambhare@amns.in','Pankaj.deore@amns.in','Amol.wadalkar@amns.in'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=e=>e.split('@')[0].split('.').map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>'OBS-'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const newObs=(assign='')=>({id:uid(),location:'',text:'',assign,status:'Open'});
let obs=[newObs()], photos={}, restoring=false;
const opts=sel=>'<option value="">— Select person —</option>'+ASSIGNEES.map(e=>`<option value="${e}" ${e===sel?'selected':''}>${nameOf(e)} (${e})</option>`).join('');
$('assignAll').innerHTML=opts('');$('obsDate').value=today();$('obsDate').oninput=()=>later();$('lineSelect').value='';

/* ---------- autosave (IndexedDB, survives closing the browser) ---------- */
let dbp=null;
const openDB=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('amns_obs_draft',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=async(m,f)=>{const db=await openDB();return new Promise((ok,no)=>{const t=db.transaction('kv',m),r=f(t.objectStore('kv'));t.oncomplete=()=>ok(r&&r.result);t.onerror=t.onabort=()=>no(t.error)})};
const dbSet=(k,v)=>tx('readwrite',s=>s.put(v,k)), dbGet=k=>tx('readonly',s=>s.get(k)), dbDel=k=>tx('readwrite',s=>s.delete(k)), dbKeys=()=>tx('readonly',s=>s.getAllKeys());
const saved=()=>{$('saveStatus').className='save-status';$('saveStatus').innerText='💾 Draft autosaved at '+new Date().toLocaleTimeString()};
const failed=e=>{console.error(e);$('saveStatus').className='save-status err';$('saveStatus').innerText='⚠ Autosave failed (storage full/blocked) – submit soon'};
async function saveForm(){if(restoring)return;try{await dbSet('form',{date:$('obsDate').value,line:$('lineSelect').value,assignAll:$('assignAll').value,obs});saved()}catch(e){failed(e)}}
async function savePh(id){if(restoring)return;try{await dbSet('photos:'+id,(photos[id]||[]).map(f=>({n:f.name,t:f.type,b:f})));saved()}catch(e){failed(e)}}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(saveForm,350)};
const flush=()=>{clearTimeout(tm);return saveForm()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});addEventListener('pagehide',flush);

/* ---------- UI ---------- */
function render(all){
  $('obsList').innerHTML=obs.map((o,i)=>`<div class="category-section" data-id="${o.id}">
   <div class="category-title">Observation ${i+1}${obs.length>1?`<button type="button" class="rm-obs" onclick="rmObs('${o.id}')">✕ Remove</button>`:''}</div>
   <div class="obs-grid">
    <div class="input-field"><label>Location</label><input type="text" data-k="location" placeholder="e.g. CGL-2 Exit area" value="${esc(o.location)}"></div>
    <div class="input-field full"><label>Observation</label><textarea data-k="text" rows="3" placeholder="Describe the observation and what needs to be done">${esc(o.text)}</textarea></div>
    <div class="photo-field full"><label>Photos (up to ${MAX_PH})</label><div class="photo-controls">
      <button type="button" class="btn-select-photo" style="border:none" onclick="openCam('${o.id}')">📷 Live Capture</button>
      <label class="btn-select-photo" for="f_${o.id}">🖼️ Gallery</label><input type="file" id="f_${o.id}" data-file="${o.id}" accept="image/*" multiple style="display:none"></div>
      <div class="preview-container" id="pv_${o.id}"></div></div>
   </div></div>`).join('');
  obs.forEach(o=>prev(o.id));
  if(all)document.querySelectorAll('#obsList .category-section').forEach(c=>c.classList.add('new'));
  $('addBtn').innerText=`+ Add Observation (${obs.length}/${MAX_OBS})`;$('addBtn').disabled=obs.length>=MAX_OBS;$('cnt').innerText=obs.length;
}
function prev(id){const b=$('pv_'+id);if(!b)return;b.innerHTML='';(photos[id]||[]).forEach((f,i)=>{const d=document.createElement('div');d.className='preview-thumb';d.innerHTML=`<img src="${URL.createObjectURL(f)}"><button type="button" class="remove-btn">✕</button>`;d.querySelector('button').onclick=()=>{photos[id].splice(i,1);prev(id);savePh(id)};b.appendChild(d)})}
const addObs=()=>{if(obs.length>=MAX_OBS)return;obs.push(newObs($('assignAll').value));render();$('obsList').lastElementChild.classList.add('new');saveForm();setTimeout(()=>$('obsList').lastElementChild.scrollIntoView({behavior:'smooth'}),50)};
function rmObs(id){if(!confirm('Remove this observation and its photos?'))return;obs=obs.filter(o=>o.id!==id);delete photos[id];dbDel('photos:'+id);render();saveForm()}
$('assignAll').onchange=$('obsDate').onchange=()=>saveForm();
const cardOf=t=>{const c=t.closest('[data-id]');return c&&obs.find(o=>o.id===c.dataset.id)};
$('obsList').addEventListener('input',e=>{const o=cardOf(e.target);if(o&&e.target.dataset.k){o[e.target.dataset.k]=e.target.value;later()}});
$('obsList').addEventListener('change',e=>{const t=e.target;if(t.dataset.file){const id=t.dataset.file;photos[id]=photos[id]||[];[...t.files].forEach(f=>{if(photos[id].length<MAX_PH)photos[id].push(f)});t.value='';prev(id);savePh(id)}else{const o=cardOf(t);if(o&&t.dataset.k){o[t.dataset.k]=t.value;later()}}});

/* ---------- live camera ---------- */
let stream=null,camId=null;
async function openCam(id){photos[id]=photos[id]||[];if(photos[id].length>=MAX_PH){alert('Maximum '+MAX_PH+' photos.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Live camera needs HTTPS and camera permission.');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});camId=id;$('camVideo').srcObject=stream;$('camModal').style.display='flex';$('camInfo').innerText=`Captured: ${photos[id].length} / ${MAX_PH}`}catch(e){alert('Camera access denied or unavailable.')}}
function snap(){const v=$('camVideo');if(!v.videoWidth||photos[camId].length>=MAX_PH)return;const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const id=camId;
  c.toBlob(b=>{photos[id].push(new File([b],`live_${Date.now()}.jpg`,{type:'image/jpeg'}));prev(id);savePh(id);$('camInfo').innerText=`Captured: ${photos[id].length} / ${MAX_PH}`},'image/jpeg',.8)}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camModal').style.display='none'}

/* ---------- Excel (same layout as the observation sheet) ---------- */
const fmtDate=d=>d?d.split('-').reverse().join('.'):'';
function shrink(file,max=800,q=.6){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res({data:c.toDataURL('image/jpeg',q).split(',')[1],w:c.width,h:c.height})};i.onerror=()=>res(null);i.src=e.target.result};r.readAsDataURL(file)})}
async function buildXlsx(rows){
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Sheet1');
  [6,13,12,20,38,18,62,26,12,28,24,22,16].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFCE4D6'}},thin={style:'thin'},med={style:'medium'};
  ws.mergeCells('A1:M1');const t=ws.getCell('A1');t.value=`AM/NS INDIA — Line Observation Report — ${$('lineSelect').value}`;t.font={name:'Arial',size:14,bold:true};t.fill=fill;t.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=30;
  ['Sr. No','Date','Line','Location','Observation','Responsibility','Photos','AFTER \nPHOTO','Status','Corrective action/\nRecommendation','Obs ID','Observer Name','Observer SAP ID'].forEach((h,i)=>{const c=ws.getCell(2,i+1);c.value=h;c.font={name:'Arial',size:12,bold:true};c.fill=fill;c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={top:med,bottom:med,left:thin,right:thin}});ws.getRow(2).height=47;
  const PW=62,colPx=PW*7+5,PAD=6,MAXROW=540,MAXH=320;
  for(let n=0;n<rows.length;n++){const o=rows[n],r=n+3,ph=o.photos||[];
    [n+1,fmtDate(o.date),$('lineSelect').value,o.location,o.text,nameOf(o.assign),'','',o.status,'',o.id,$('observerName').value.trim(),$('sapId').value.trim()].forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.font={name:'Arial',size:12};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={top:thin,bottom:thin,left:thin,right:thin}});
    ws.getCell(r,9).dataValidation={type:'list',allowBlank:true,formulae:['"Open,Close"']};
    const cols=ph.length>1?2:1,cw=(colPx-PAD*(cols+1))/cols;
    const its=ph.map(p=>{const k=Math.min(cw/p.w,MAXH/p.h);return{p,w:p.w*k,h:p.h*k}});
    const grid=[];for(let q=0;q<its.length;q+=cols)grid.push(its.slice(q,q+cols));
    const sumH=()=>grid.reduce((a,g)=>a+Math.max(...g.map(t=>t.h)),0);
    let tot=sumH()+PAD*(grid.length+1);
    if(grid.length&&tot>MAXROW){const f=(MAXROW-PAD*(grid.length+1))/sumH();its.forEach(t=>{t.w*=f;t.h*=f});tot=sumH()+PAD*(grid.length+1)}
    const hPt=Math.min(409,Math.max(tot*.75,Math.ceil(o.text.length/38)*16+10,45));ws.getRow(r).height=hPt;const actPx=hPt/.75;
    let y=Math.max(0,(actPx-tot)/2)+PAD;
    grid.forEach(g=>{const rh=Math.max(...g.map(t=>t.h)),ox=(cols-g.length)*(cw+PAD)/2;
      g.forEach((t,ci)=>{const x=PAD+ox+ci*(cw+PAD)+(cw-t.w)/2,yy=y+(rh-t.h)/2;
        const id=wb.addImage({base64:t.p.data,extension:'jpeg'});
        ws.addImage(id,{tl:{col:6+x/colPx,row:r-1+yy/actPx},ext:{width:t.w,height:t.h},editAs:'oneCell'})});
      y+=rh+PAD})}
  return wb.xlsx.writeBuffer();
}
const plus=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function mailBody(name,list,due,link){
  const rows=list.map(o=>`<tr><td style="border:1px solid #ccc;padding:6px;text-align:center">${o.n}</td><td style="border:1px solid #ccc;padding:6px">${esc(o.location)}</td><td style="border:1px solid #ccc;padding:6px">${esc(o.text)}</td></tr>`).join('');
  return `<div style="font-family:Arial,sans-serif;font-size:14px;color:#1E293B"><p>Dear ${esc(name)},</p>
  <p>During the line inspection on <b>${fmtDate($('obsDate').value)}</b> on <b>${esc($('lineSelect').value)}</b>, <b>${list.length}</b> observation(s) (5S / UC / UA) have been assigned to you (observer: ${esc($('observerName').value.trim())}, SAP ID ${esc($('sapId').value.trim())}, line ${esc($('lineSelect').value)}). Please find the details below and the attached Excel sheet with photos.</p>
  <table style="border-collapse:collapse;font-size:13px"><tr style="background:#FCE4D6"><th style="border:1px solid #ccc;padding:6px">Sr.</th><th style="border:1px solid #ccc;padding:6px">Location</th><th style="border:1px solid #ccc;padding:6px">Observation</th></tr>${rows}</table>
  ${link?`<p style="color:#C1121F"><b>Action required:</b> Please attend to each point and submit the <b>corrective action</b> and <b>AFTER photos</b> for all points through the link below (all your points open on one page, already filled in). The compliance report goes to the reviewer automatically. Due: <b>${fmtDate(due)}</b>.</p>
  <p><a href="${link}" style="background:#E31837;color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:bold;display:inline-block">SUBMIT CORRECTIVE ACTION &amp; AFTER PHOTOS</a></p><p style="font-size:12px;color:#475569">Link not working? Copy this address into your browser:<br>${link}</p>`:`<p style="color:#C1121F"><b>Action required:</b> Please attend to each point and complete the corrective action. Due: <b>${fmtDate(due)}</b>.</p>`}
  <p>Regards,<br>${esc($('observerName').value.trim())}<br>AM/NS INDIA</p></div>`}
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
async function collect(){ // validate + shrink photos
  if(!$('observerName').value.trim())throw new Error('Please enter Observer Name.');
  if(!$('sapId').value.trim())throw new Error('Please enter Observer SAP ID.');
  if(!$('lineSelect').value)throw new Error('Please select CGL 1 or CGL 2.');
  if(!$('obsDate').value)throw new Error('Please select the Date at the top.');
  if(!$('assignAll').value)throw new Error('Please select Assign to at the top.');
  const used=obs.filter(o=>o.location.trim()||o.text.trim()||(photos[o.id]||[]).length);
  if(!used.length)throw new Error('Please fill at least one observation.');
  if(!$('obsDate').value)throw new Error('Please select the Observation Date at the top.');
  const out=[];for(const [i,o] of used.entries()){
    if(!o.location.trim()||!o.text.trim())throw new Error(`Observation ${obs.indexOf(o)+1}: Location and Observation are required.`);
    const ph=[];for(const f of (photos[o.id]||[])){const p=await shrink(f);if(p)ph.push(p)}
    let thumb='';const f0=(photos[o.id]||[])[0];if(f0){for(const mx of [240,180,120]){const t=await shrink(f0,mx,.5);if(t&&t.data.length<30000){thumb=t.data;break}}}
    out.push({...o,date:$('obsDate').value,assign:$('assignAll').value,text:o.text.trim(),location:o.location.trim(),photos:ph,thumb})}
  return out}

/* Local Excel preview: photos are embedded in the workbook. */
async function downloadExcel(){
  try{
    if(typeof ExcelJS==='undefined')throw new Error('Excel library not loaded. Connect to internet and reload.');
    await flush();const rows=await collect();const wb=await buildXlsx(rows);const blob=new Blob([wb],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`AMNS_Line_Observation_${today()}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    $('statusMessage').innerText='Excel preview downloaded with embedded photos.';
  }catch(e){$('statusMessage').innerText=e.message}
}

/* ---------- submit ---------- */
async function submitForm(){
  const st=$('statusMessage'),btn=$('submitBtn');btn.disabled=true;
  try{
    if(typeof ExcelJS==='undefined')throw new Error('Excel library not loaded (check internet).');
    if(FLOW_URL.startsWith('PASTE_'))throw new Error('Set FLOW_URL at the top of the script first.');
    await flush();st.innerHTML='<span style="color:#F59E0B">⏳ Processing photos & building Excel...</span>';
    const rows=await collect(),sid='SUB-'+Date.now(),token=mkToken(),link=RESPONSE_URL.startsWith('PASTE_')?'':`${RESPONSE_URL}${RESPONSE_URL.includes('?')?'&':'?'}s=${encodeURIComponent(sid)}&t=${token}`,groups={},due=plus(2);
    rows.forEach(r=>(groups[r.assign]=groups[r.assign]||[]).push(r));
    const assignments=[];for(const [email,list] of Object.entries(groups)){assignments.push({email,name:nameOf(email),count:list.length,importance:'High',dueDate:fmtDate(due),subject:`[HIGH PRIORITY] Line Observation – ${list.length} point(s) assigned to you – compliance due ${fmtDate(due)}`,bodyHtml:mailBody(nameOf(email),list.map((o,i)=>({...o,n:i+1})),due,link),fileName:`Line_Observation_${nameOf(email).replace(/ /g,'_')}_${today()}.xlsx`,excelBase64:b64(await buildXlsx(list))})}
    const payload={facility:'AM/NS INDIA',line:$('lineSelect').value,reportedBy:$('observerName').value.trim(),sapId:$('sapId').value.trim(),reviewerEmail:REVIEWER_EMAIL,token,submissionId:sid,dueDate:fmtDate(due),submittedAt:new Date().toISOString(),
      observations:rows.map((r,i)=>({obsId:r.id,srNo:i+1,date:fmtDate(r.date),location:r.location,observation:r.text,assignToEmail:r.assign,assignToName:nameOf(r.assign),status:r.status,thumb:r.thumb,
        photos:r.photos.map((p,k)=>({fileName:`${r.id}_${k+1}.jpg`,contentBase64:p.data}))})),assignments};
    st.innerHTML='<span style="color:#F59E0B">⏳ Sending...</span>';
    const res=await fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('Server returned '+res.status);
    await fresh();st.innerHTML=`<span style="color:#10B981">✓ ${rows.length} observation(s) submitted. A fresh form is ready.</span>`;
    $('okMsg').innerHTML=`${rows.length} observation(s) sent to <b>${assignments.map(a=>a.name).join(', ')}</b> with a link to submit corrective action. Compliance is due by <b>${fmtDate(due)}</b>.`;$('okOv').classList.add('show');boom();
  }catch(e){console.error(e);st.innerHTML=`<span style="color:#E31837">✕ ${esc(e.message)} — your draft is saved.</span>`}
  btn.disabled=false}
function boom(){const c=['#E31837','#10B981','#F59E0B','#fff','#38bdf8'];for(let i=0;i<60;i++){const e=document.createElement('i');e.className='confetti';e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
async function fresh(){restoring=true;try{for(const k of await dbKeys())await dbDel(k)}catch(e){}obs=[newObs()];photos={};$('assignAll').value='';$('lineSelect').value='';$('obsDate').value=today();restoring=false;render();scrollTo({top:0,behavior:'smooth'});$('saveStatus').innerText='💾 Autosave on'}

/* ---------- restore draft on load ---------- */
(async()=>{restoring=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  const f=await dbGet('form');if(f&&f.obs&&f.obs.length){obs=f.obs;$('assignAll').value=f.assignAll||'';$('lineSelect').value=f.line||'';if(f.date)$('obsDate').value=f.date;
    for(const o of obs){const a=await dbGet('photos:'+o.id);if(a)photos[o.id]=a.map(x=>new File([x.b],x.n,{type:x.t}))}
    const n=Object.values(photos).reduce((s,a)=>s+a.length,0);$('saveStatus').innerText=`♻ Draft restored (${obs.length} observations, ${n} photos) – autosave on`}}catch(e){failed(e)}
  restoring=false;render(true)})();
</script></body></html>
